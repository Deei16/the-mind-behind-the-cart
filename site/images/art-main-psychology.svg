<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mainTitle">
  <title id="mainTitle">Illustration of a brain shape connected by lines to several small human silhouettes and a shopping cart, representing the mix of emotion and social influence behind buying decisions</title>
  <rect width="480" height="300" fill="#F7F5EF"/>

  <!-- brain -->
  <path d="M170 110
           c-14 -18 8 -36 28 -30
           c6 -13 28 -14 36 -3
           c18 -6 36 10 29 26
           c13 8 11 27 -3 33
           c1 14 -14 24 -27 19
           c-8 11 -27 9 -32 -3
           c-16 2 -27 -13 -21 -27
           c-11 -5 -14 -18 -8 -14z"
        fill="#EDEAE0" stroke="#1C1B29" stroke-width="2.5"/>

  <!-- connection lines to silhouettes -->
  <path d="M150 140 L70 90" stroke="#2F6F6B" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M155 170 L60 190" stroke="#2F6F6B" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M230 150 L230 230" stroke="#C89B3C" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="M255 145 L360 100" stroke="#2F6F6B" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- silhouettes -->
  <g fill="#1C1B29" opacity="0.85">
    <circle cx="70" cy="78" r="10"/><path d="M52 108 a18 16 0 0 1 36 0z"/>
    <circle cx="58" cy="196" r="9"/><path d="M42 222 a16 14 0 0 1 32 0z"/>
    <circle cx="362" cy="88" r="10"/><path d="M344 118 a18 16 0 0 1 36 0z"/>
  </g>

  <!-- cart with price tag -->
  <path d="M198 235 L188 235 L206 275 L268 275 L280 245 L206 245"
        fill="none" stroke="#1C1B29" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="216" cy="288" r="8" fill="#1C1B29"/>
  <circle cx="256" cy="288" r="8" fill="#1C1B29"/>
  <circle cx="410" cy="220" r="6" fill="#B1503B"/>
  <circle cx="430" cy="180" r="5" fill="#C89B3C"/>
</svg>
