  <circle cx="90" cy="90" r="7" fill="#C89B3C"/>
  <circle cx="380" cy="110" r="5" fill="#2F6F6B"/>
  <circle cx="410" cy="230" r="6" fill="#B1503B"/>
  <circle cx="70" cy="270" r="5" fill="#2F6F6B"/>
  <circle cx="130" cy="340" r="6" fill="#C89B3C"/>
