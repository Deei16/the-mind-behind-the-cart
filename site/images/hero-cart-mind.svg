  <circle cx="192" cy="300" r="14" fill="#1C1B29"/>
  <circle cx="282" cy="300" r="14" fill="#1C1B29"/>
  <circle cx="192" cy="300" r="5" fill="#F7F5EF"/>
  <circle cx="282" cy="300" r="5" fill="#F7F5EF"/>
