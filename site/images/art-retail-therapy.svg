<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rtTitle">
  <title id="rtTitle">Illustration of a shopping bag with a small heart inside it, next to a fading mood line, representing the temporary emotional lift of retail therapy</title>
  <rect width="480" height="300" fill="#F7F5EF"/>

  <!-- shopping bag -->
  <path d="M170 120 h100 l14 130 h-128z" fill="#EDEAE0" stroke="#1C1B29" stroke-width="3"/>
  <path d="M192 120 v-14 a28 28 0 0 1 56 0 v14" fill="none" stroke="#1C1B29" stroke-width="4" stroke-linecap="round"/>
  <path d="M215 175 c0 -14 24 -14 24 0 c0 14 -12 22 -12 22 s-12 -8 -12 -22z" fill="#B1503B"/>

  <!-- fading mood curve -->
  <path d="M60 220 C 110 190, 130 150, 170 175 S 250 230, 300 205 S 380 150, 420 170"
        fill="none" stroke="#2F6F6B" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="170" cy="175" r="6" fill="#2F6F6B"/>
  <circle cx="300" cy="205" r="6" fill="#2F6F6B" opacity="0.7"/>
  <circle cx="420" cy="170" r="6" fill="#2F6F6B" opacity="0.4"/>

  <circle cx="90" cy="90" r="6" fill="#C89B3C"/>
  <circle cx="380" cy="90" r="5" fill="#C89B3C"/>
</svg>
